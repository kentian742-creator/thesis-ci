# thesis-ci metric registry v0.2
# data: xbrl = can be computed directly from EDGAR companyfacts; filing_text = has to be extracted from the text of a filing,
#   a segment table or a press release (extracted by a model, with its source noted).
#   A test may also write external (official data from outside SEC filings, such as FRED or NAIC) or mixed (components come
#   from different sources); both are defined in place with metric_def.
# xbrl lists candidate concepts in order of preference; the first one with data is used. A concept's taxonomy follows the
#   accounting standards the issuer reports under, not the form: a foreign private issuer reporting under US GAAP (for
#   example PDD's 20-F) uses us-gaap concepts as well; only issuers reporting under IFRS use ifrs-full.
# When a test needs several quantities, write metric_def.components and reference them in rule as <metric>.<component>
#   (SPEC 4.1).
# thesis-ci computes the xbrl metrics from EDGAR companyfacts (thesis_ci/metrics.py, SPEC 4.5). For a formula over several
#   quantities it tries each quantity's candidates in the order listed; the margins and ratios over revenue use the revenue
#   concepts of revenue_yoy, and roic's tax rate is income tax / pretax income. book_value_per_share_yoy is not computed:
#   no share-count concept is registered, and multi-class issuers need a conversion companyfacts does not carry.
metrics:
  - id: revenue_yoy
    description: Year-on-year growth of total revenue
    unit: "%"
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax, us-gaap:Revenues, ifrs-full:Revenue]
    formula: revenue_t / revenue_{t-4q} - 1

  - id: revenue_growth_organic_cc
    description: Organic, constant-currency revenue growth (company definition)
    unit: "%"
    frequency: quarter
    data: filing_text
    where: organic growth table of the earnings press release or the MD&A

  - id: segment_revenue_yoy
    description: Year-on-year revenue growth of a segment or product line (params.segment names the segment, params.basis the basis)
    unit: "%"
    frequency: quarter
    data: filing_text
    where: segment note or earnings press release

  - id: segment_operating_margin
    description: Operating margin of a segment (params.segment)
    unit: "%"
    frequency: quarter
    data: filing_text
    where: segment note

  - id: gross_margin
    description: Gross margin
    unit: "%"
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:GrossProfit, ifrs-full:GrossProfit]
    formula: gross_profit / revenue

  - id: operating_margin
    description: Operating margin
    unit: "%"
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:OperatingIncomeLoss, ifrs-full:ProfitLossFromOperatingActivities]
    formula: operating_income / revenue

  - id: free_cash_flow
    description: Free cash flow = operating cash flow − capital expenditure (excluding finance leases)
    unit: USD
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, ifrs-full:CashFlowsFromUsedInOperatingActivities, ifrs-full:PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities]
    formula: operating_cash_flow - capex

  - id: free_cash_flow_yoy
    description: Year-on-year change in free cash flow (by fiscal year)
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment]
    formula: fcf_t / fcf_{t-1y} - 1

  - id: fcf_conversion
    description: Free cash flow ÷ net income (GAAP)
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:NetIncomeLoss, ifrs-full:ProfitLoss]
    formula: free_cash_flow / net_income

  - id: fcf_to_non_gaap_net_income
    description: Free cash flow ÷ non-GAAP net income (adjusted net income as the company defines it)
    unit: "%"
    frequency: year
    data: filing_text
    where: non-GAAP reconciliation table of the earnings press release

  - id: capex_to_revenue
    description: Cash capital expenditure ÷ revenue (excluding finance leases)
    unit: "%"
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, ifrs-full:PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities]
    formula: capex / revenue

  - id: diluted_shares_yoy
    description: Year-on-year change in weighted-average diluted shares (buyback discipline)
    unit: "%"
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding, ifrs-full:WeightedAverageNumberOfOrdinarySharesOutstandingDiluted]
    formula: diluted_shares_t / diluted_shares_{t-4q} - 1

  - id: buyback_amount
    description: Amount spent on share repurchases
    unit: USD
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:PaymentsForRepurchaseOfCommonStock, ifrs-full:PaymentsToAcquireOrRedeemEntitysShares]

  - id: shareholder_return_to_fcf
    description: (Buybacks + dividends) ÷ free cash flow
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:PaymentsForRepurchaseOfCommonStock, us-gaap:PaymentsOfDividends, us-gaap:PaymentsOfDividendsCommonStock]
    formula: (buybacks + dividends) / free_cash_flow

  - id: dividend_payout_ratio
    description: Dividends ÷ net income
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:PaymentsOfDividends, us-gaap:NetIncomeLoss]
    formula: dividends / net_income

  - id: roic
    description: Return on invested capital (after-tax operating profit ÷ average invested capital; invested capital = equity + interest-bearing debt − cash)
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:OperatingIncomeLoss, us-gaap:IncomeTaxExpenseBenefit, us-gaap:StockholdersEquity, us-gaap:LongTermDebt, us-gaap:CashAndCashEquivalentsAtCarryingValue]
    formula: nopat / avg(equity + debt - cash)

  - id: incremental_roic_3y
    description: Three-year incremental after-tax return on invested capital (Δ after-tax operating profit ÷ Δ invested capital)
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:OperatingIncomeLoss, us-gaap:StockholdersEquity, us-gaap:LongTermDebt]
    formula: (nopat_t - nopat_{t-3y}) / (ic_t - ic_{t-3y})

  - id: roe
    description: Return on equity
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:NetIncomeLoss, us-gaap:StockholdersEquity, ifrs-full:ProfitLoss, ifrs-full:Equity]
    formula: net_income / avg(equity)

  - id: book_value_per_share_yoy
    description: Book value per share, year on year
    unit: "%"
    frequency: year
    data: xbrl
    xbrl: [us-gaap:StockholdersEquity]
    formula: (equity / shares_outstanding)_t / (…)_{t-1y} - 1

  - id: net_cash
    description: Net cash = cash, cash equivalents and short-term investments − interest-bearing debt
    unit: USD
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:CashAndCashEquivalentsAtCarryingValue, us-gaap:ShortTermInvestments, us-gaap:LongTermDebt, ifrs-full:CashAndCashEquivalents]
    formula: cash + short_term_investments - debt

  - id: net_debt_to_ebitda
    description: Net debt ÷ EBITDA
    unit: x
    frequency: year
    data: xbrl
    xbrl: [us-gaap:LongTermDebt, us-gaap:CashAndCashEquivalentsAtCarryingValue, us-gaap:OperatingIncomeLoss, us-gaap:DepreciationDepletionAndAmortization]
    formula: (debt - cash) / (operating_income + d_and_a)

  - id: rpo_yoy
    description: Remaining performance obligations (backlog), year on year
    unit: "%"
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:RevenueRemainingPerformanceObligation]
    formula: rpo_t / rpo_{t-4q} - 1

  - id: provision_for_credit_losses
    description: Provision for credit losses (a net charge is positive)
    unit: USD
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:ProvisionForLoanLeaseAndOtherLosses, us-gaap:ProvisionForLoanAndLeaseLosses]

  - id: net_write_off_rate
    description: Net write-off rate (company definition, card loans)
    unit: "%"
    frequency: quarter
    data: filing_text
    where: credit quality tables of the 10-Q/10-K, or the earnings supplement

  # Operating readings of card issuers (for example AXP): company definitions, read from the earnings press release, the
  # supplement or the MD&A of the 10-Q/10-K.
  - id: net_card_fees_yoy
    description: Year-on-year growth of net card fees
    unit: "%"
    frequency: quarter
    data: filing_text
    where: Net card fees line of the income statement, or the revenue table of the earnings press release

  - id: card_member_services_to_revenue
    description: Card Member services expense ÷ total revenues net of interest expense
    unit: "%"
    frequency: quarter
    data: filing_text
    where: Card Member services line and Total revenues net of interest expense line of the income statement

  - id: discount_revenue_to_billed_business
    description: Discount revenue ÷ billed business (an approximation of the merchant rate)
    unit: "%"
    frequency: quarter
    data: filing_text
    where: Discount revenue line of the income statement; billed business from the operating statistics table of the earnings supplement

  - id: reserve_build_release
    description: "Build (positive) or release (negative) of the reserve for credit losses: provision − net write-offs"
    unit: USD
    frequency: quarter
    data: filing_text
    where: table of changes in the reserve for credit losses in the MD&A of the 10-Q/10-K, or the earnings supplement

  - id: interest_expense_minus_income_growth
    description: Year-on-year growth of interest expense − year-on-year growth of interest income (pressure on the funding side)
    unit: pp
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:InterestExpense, us-gaap:InterestExpenseOperating, us-gaap:InterestAndDividendIncomeOperating]
    formula: yoy(interest_expense) - yoy(interest_income)

  - id: combined_ratio
    description: Insurance combined ratio (params.segment names the business)
    unit: "%"
    frequency: quarter
    data: filing_text
    where: insurance segment table

  - id: cash_and_tbills_to_total_assets
    description: Cash and Treasury bills ÷ total assets
    unit: "%"
    frequency: quarter
    data: xbrl
    xbrl: [us-gaap:CashAndCashEquivalentsAtCarryingValue, us-gaap:ShortTermInvestments, us-gaap:Assets]
    formula: (cash + tbills) / total_assets

  - id: customer_concentration
    description: Share of revenue or backlog from a single customer (params.basis)
    unit: "%"
    frequency: quarter
    data: filing_text
    where: revenue note or risk factors

  - id: headcount_yoy
    description: Headcount, year on year
    unit: "%"
    frequency: year
    data: filing_text
    where: human capital section of 10-K Item 1, or 20-F Item 6
