# thesis-ci check registry v0.2
# scope: public = runs in the public archive repository only; private = runs in the private archive repository only;
#        both = runs in both; workspace = needs to see the public and the private repository together (locally or in the
#        acceptance script).
# level: error blocks the merge; warning is only reported.
checks:
  - id: C-SCHEMA
    title: Files match their schemas
    scope: both
    level: error
    description: >-
      Following the file-name mapping of SPEC section 2, every YAML file and the front matter of story.md pass validation
      against the corresponding JSON Schema. Dates in YAML are converted to ISO strings before validation. Also checks
      the consistency a schema cannot express: repeated keys; the company of a file under companies/<TICKER>/ equals the
      directory name, and the id of industry.yml equals the directory name; no tag is repeated within one sources.yml;
      the pre-registration trio is named as in SPEC 2.1, the period in the file name agrees with event.period (period in
      the settlement file), author is system in <period>.yml and owner in <period>-owner.yml, and the ids of items and
      overrides start with <TICKER>-<period>-; a warning when the spec_version of repo.yml is not the current version.

  - id: C-SRC-TAG
    title: Fact numbers in Markdown carry source tags
    scope: both
    level: error
    description: >-
      Following SPEC 3.4, every sentence that contains a fact number has at least one [src:...]; every tag resolves in the
      applicable sources.yml. Text in Chinese, Japanese or Korean is split into sentences at the Chinese sentence marks
      and at every newline; English text at . ! ? or ; followed by whitespace, not after an abbreviation, and a line break
      inside an English paragraph does not end a sentence. The Chinese version of a content file (zh-CN/<same path>) is
      checked like the file it translates, and its tags resolve the same way.

  - id: C-SRC-FACT
    title: YAML facts carry resolvable sources
    scope: both
    level: error
    description: >-
      The source, settlement_source and acknowledged_source fields in any YAML under companies/ and industries/ resolve to
      a sources.yml; a fact number in a free-text field of thesis.yml, ledger.yml, valuation.yml or industry.yml (claim,
      summary, category_rationale, pillars.claim, implication, note and so on) likewise needs a [src:...] in the same
      sentence. Criteria written down in advance (fail_if, warn_if, rule, question and so on) and predictions
      (pre-registration items; the statement and note of ledger entries whose side is system or owner) are not facts and
      need no tag.

  - id: C-SRC-ACCESSION
    title: Periodic-report sources carry an EDGAR accession number
    scope: both
    level: warning
    description: >-
      A warning when an entry of sources.yml with kind filing has no accession.

  - id: C-PUBLIC-NO-VALUATION
    title: The public repository contains no value ranges or price ranges
    scope: public
    level: error
    description: >-
      The public repository must not contain valuation.yml, memos/, escalations/ or decision-log/; no YAML may have the
      keys value_ranges, price_reference, implied_return or price_rating; public content (companies/, including
      companies/*/updates/; industries/, forecasts/, letters/ and the mistakes.md at the root) must not contain the
      valuation wording of 00 §H4 (买入区间, 价值中枢, 目标价, 隐含回报, 隐含年化回报, 价格评级, price target, target price, buy range,
      fair value range); a multiple or ratio that takes the share price as an input (市盈率, P/E, 市值, 自由现金流收益率, FCF yield,
      市净率, P/B, and wording such as "the price is below N times book"; the company's disclosed ratio of its average
      repurchase price to book does not count) together with a number (years and dates do not count) in the same
      sentence is an error. The English equivalents of these lists (SPEC 7.5) are errors too, and the Chinese versions of
      content files under zh-CN/ are public content. docs/STATUS.md and CLAUDE.md are read too, and a price grade next
      to a ticker ("AXP B− → C") in a sentence about prices or valuation is an error (SPEC 7.5).

  - id: C-PUBLIC-NO-ADVICE
    title: Public content contains no buy/sell advice
    scope: public
    level: error
    description: >-
      Public content (companies/, including companies/*/updates/; industries/, forecasts/, letters/, the mistakes.md at
      the root) and any README must not contain the buy/sell advice wording of 00 §H4 (建议买入, 建议卖出, 建议增持, 建议减持,
      建议加仓, 建议减仓, 买入评级, 卖出评级, 强烈推荐, 值得买入, 应该买入, 可以买入, 逢低买入, 建议建仓, 建议清仓, strong buy, overweight,
      underweight), nor give the same advice in other words (推荐买入, 应该卖出, 评级上调至买入, buy rating, I recommend buying and
      so on). overweight and underweight count as advice only as a rating or stance. The English equivalents of the list
      (SPEC 7.5) are advice too, in a negative sentence as well ("we do not recommend buying", 00 §H4); a company buying
      back its own shares is not advice. The Chinese versions of content files under zh-CN/ are public content, and
      docs/STATUS.md and CLAUDE.md are read too.

  - id: C-PUBLIC-NO-AMOUNTS
    title: The public repository contains no position amounts
    scope: public
    level: error
    description: >-
      Public YAML must not have the keys position, position_size, shares_held, cost_basis, amount_usd, account, weight or
      target_weight; no string may look like a brokerage account number (such as U followed by 7 or more digits).

  - id: C-NO-PRICE-FEED
    title: No daily share prices are fetched
    scope: both
    level: error
    description: >-
      Code and workflows must not reference market-data feeds (yfinance, yahoo finance, alphavantage, polygon.io,
      finnhub, iexcloud, twelvedata, stooq, marketstack, /v7/finance/quote and the like). The only exceptions are the
      private repository's pipeline/price_alert.py (a one-off alert when a price crosses a value range) and
      pipeline/price_history.py (the price reference and the past year-end unadjusted closing prices used by the private
      valuation, 00 §H2). Public data files must not have the keys price, last_price or close, and public content must not
      display a share price.

  - id: C-NO-TRADING
    title: No trades are executed
    scope: both
    level: error
    description: >-
      No code may reference a broker or trading interface (ib_insync, ib_async, ibapi, alpaca, robin_stocks, tda-api,
      schwab, place_order, submit_order, placeOrder).

  - id: C-LLM-ENTRY
    title: Model calls only in pipeline/llm.py
    scope: both
    level: error
    description: >-
      Apart from pipeline/llm.py, no .py file may import a model SDK (anthropic, openai, google.generativeai, google.genai,
      litellm, langchain, mistralai, cohere).

  - id: C-NO-SECRETS
    title: No secrets are committed
    scope: both
    level: error
    description: >-
      Files must not contain strings that look like API keys (long strings starting with sk-ant-, sk-, ghp_, gho_,
      github_pat_ or AKIA) or assign a secret directly to a *_API_KEY / *_TOKEN variable.

  - id: C-TESTS-MIN
    title: At least 5 tests per company, all three types
    scope: public
    level: error
    description: >-
      Every companies/*/thesis.yml has at least 5 tests still in force (a test with retired_at is kept as a record only
      and does not count), with at least 1 each of quantitative, qualitative and staleness; test ids are unique within
      the file and start with the company's ticker; supersedes names another test of the same file; retired_at is not
      earlier than effective_from.

  - id: C-TESTS-COVERAGE
    title: Tests cover the touchstones of business quality
    scope: public
    level: error
    description: >-
      Constitution rule 2. Taken together, the covers of each company's tests still in force must include moat,
      pricing_power, returns_on_capital and free_cash_flow.

  - id: C-TESTS-CAPALLOC
    title: Tests cover capital allocation
    scope: public
    level: error
    description: >-
      Constitution rule 3. Each company has at least 1 test still in force whose covers include capital_allocation, and
      at least 1 whose covers include management.

  - id: C-TEST-METRIC
    title: Quantitative tests are executable
    scope: public
    level: error
    description: >-
      The metric of every quantitative test is registered in spec/metrics.yml, or a metric_def is given; rule can be
      parsed as a machine decision (op/threshold or all_of/any_of); data agrees with the metric definition; the metric in
      rule and warn_rule must resolve: a metric in the registry, this test's metric or metric_def, a component of
      metric_def.components, or <metric>.<component> (the component must be defined in components).

  - id: C-TEST-QUAL-EVIDENCE
    title: Qualitative tests require an independent judgment and sources
    scope: public
    level: error
    description: >-
      Every qualitative test has question and fail_if, judge is independent_model, evidence is required, where names the
      documents read for the judgment, and lookback is a positive integer (how many periods are read, the current one
      included).

  - id: C-STALENESS
    title: Staleness tests can be computed and are not expired
    scope: public
    level: warning
    description: >-
      The section of every staleness test still in force has a date in reviewed; computed as max_age_quarters × 91 days,
      an expired one gives a warning.

  - id: C-DEPENDS
    title: Industry dependencies resolve and industry modules stay neutral
    scope: public
    level: error
    description: >-
      Every depends_on of thesis.yml points to an existing industries/<id>/industry.yml; industry modules (industry.yml
      and README.md) must not contain words such as holding, 持仓, depends or 依赖本行业的公司, nor buy/sell advice.

  - id: C-STORY
    title: The two-minute story exists and is short enough
    scope: public
    level: error
    description: >-
      Every companies/<TICKER>/ has a story.md whose front matter is valid and whose company equals the directory name,
      and whose body (without source tags and Markdown markup) is at most 700 characters in Chinese, Japanese or Korean,
      or at most 350 words in English (SPEC 5).

  - id: C-RATING-ORDER
    title: Quality first, management second, valuation third
    scope: both
    level: error
    description: >-
      Constitution rule 1. The ratings of every company's thesis.yml include business and management; when the private
      repository has hq/ranking.yml (the series ranking, 00 §V13), every row gives its reason in reason. The ranking is an
      overall judgment under §V13, never a mechanical sort by any field, so the order itself is not checked.

  - id: C-CONCENTRATION
    title: Concentrated holdings and the entry bar
    scope: both
    level: error
    description: >-
      Constitution rule 4. portfolio.max_holdings of decision-rights.yml is a positive integer (a warning above 5: the
      rule says "about 4–5 companies") and entry_band equals [0.10, 0.20]; in the public repository, more companies with
      status holding than max_holdings gives a warning; in the private repository, a buy/add memo whose target_weight is
      below the bottom of the entry bar (10%) is an error. 10–20% is an entry bar, not a target: above the top (20%) is
      allowed (a business held with higher conviction can be larger), but an empty weight_note gives a warning.

  - id: C-DISCOUNT-RATE
    title: Discount rate = 10-year Treasury yield + this company's premium, with the basis written down
    scope: private
    level: error
    description: >-
      Constitution rule 5 (detailed in 00 §V1 and §V10). In every valuation.yml, discount_rate.total equals risk_free +
      premium (within 0.0005; a warning, not an error, when all three are null); once a discount rate is filled in,
      discount_rate.note (the basis for the premium) is not empty; method_note is not empty; a missing risk_free_date
      (the date the Treasury yield was read) gives a warning. The premium is derived only from the company's own
      cash-flow record and is not compared across companies.

  - id: C-SELL-REASONS
    title: Sell only for permanent deterioration or a clearly better opportunity
    scope: both
    level: error
    description: >-
      Constitution rule 6. memo.sell_reasons of decision-rights.yml agrees with the sell_reason enum of memo.schema.json,
      and forbidden_sell_reasons includes a price decline, a recession, panic and a single missed quarter; in the private
      repository, a trim or sell memo must cite an allowed reason.

  - id: C-HURDLE
    title: The long-term expectation clears the Berkshire or VOO hurdle
    scope: private
    level: error
    description: >-
      Constitution rule 7 (the order of the hurdles is the engineering default of 00 §V6, not the higher of the two).
      Every valuation.yml has hurdles; Berkshire's implied return (hurdles.brk) is the first hurdle and VOO's forward
      return (hurdles.voo) the second reference; without brk, voo is the hurdle. The hurdle of a buy/add memo is not below
      the first hurdle and its implied_return is above it, otherwise an error; clearing only the first hurdle and not the
      VOO reference gives a warning. A holding below either line gives a warning, for HQ to weigh in the quarterly
      ranking (17C).

  - id: C-SINGLE-ORDER
    title: A position is built with one order
    scope: both
    level: error
    description: >-
      Constitution rule 8. portfolio.single_order_entry of decision-rights.yml is true; the order.type of buy/add memos is
      single; more memos in a month than memo.monthly_target_max gives a warning.

  - id: C-DEFAULT-HOLD
    title: Money matters default to no action
    scope: both
    level: error
    description: >-
      memo.default_option of decision-rights.yml is maintain and timeout_days is 14; the default_option of every memo is
      maintain.

  - id: C-DECISION-RIGHTS
    title: The three decision levels are consistent
    scope: public
    level: error
    description: >-
      buy, add, trim, sell and amend_constitution appear only in L3; L1 and L2 contain no money matters; no action appears
      at more than one level; trust.levels has the four levels 0–3, and initial is 1.

  - id: C-CONSTITUTION-MAP
    title: Every constitution rule has an executable check
    scope: public
    level: error
    description: >-
      Every rule of constitution/rules.yml references at least one check id, and every id is in this registry, registered
      in the implementation and covered by a unit test.

  - id: C-AGENT-ISOLATION
    title: What the auditor and the blind reader see is isolated
    scope: public
    level: error
    description: >-
      The cannot_see of agents/auditor.yml includes reasoning and conclusions; the cannot_see of agents/blind_reader.yml
      includes thesis, draft and conclusions; neither reports to company_manager.

  - id: C-PREREG-TIMING
    title: Pre-registrations are merged before the results are first public
    scope: public
    level: error
    description: >-
      The deadline of an items file (prereg/<period>.yml and <period>-owner.yml) falls before the release date (a UTC
      time is read as a date on EDGAR's US Eastern clock); the owner's file has the same deadline as the system's file;
      when the settlement file prereg/<period>.settlement.yml has merged_at, merged_at must be earlier than the deadline,
      and when it has acceptance_datetime, the deadline must be earlier than it; a warning when the deadline has passed
      and no merged_at is recorded.

  - id: C-PREREG-IMMUTABLE
    title: Pre-registrations cannot change after the deadline
    scope: public
    level: error
    description: >-
      Every items file (prereg/<period>.yml and <period>-owner.yml) whose deadline has passed (as of --today) must have
      the timestamp proof <file>.ots next to it; when the OpenTimestamps client ots is on PATH, the file's sha256 is
      first compared locally with the hash recorded in the proof (ots info, no network), and a mismatch or an unreadable
      proof is an error; once they match, the check passes when ots verify passes, is an error when the client says the
      proof itself is bad, and gives a warning when there is no Bitcoin node, the proof is still awaiting confirmation or
      the calendar servers cannot be reached. A warning when ots is not installed. Passes vacuously when there are no
      pre-registration files.

  - id: C-TRUST-WRITE
    title: Trust levels and review dates are maintained by the pipeline
    scope: public
    level: warning
    description: >-
      00 §G8. With trust/levels.yml, the trust_level of every thesis.yml equals the company manager's level recorded
      there (an industry.yml that writes trust_level is likewise compared with the industry researcher's level recorded
      there); when a quarterly update (the front matter of companies/*/updates/) writes reviewed_sections, every reviewed
      date of thesis.yml that equals that update's as_of must have its part listed in reviewed_sections.

  - id: C-TEST-FROZEN
    title: Thresholds for the current period do not change after the results are out
    scope: public
    level: error
    description: >-
      00 §G7. When --base-ref (a git ref) and --period (the current period, FY<year>Q<quarter>) are given and the
      repository is a git work tree, the tests of thesis.yml are compared one by one with the base version: for a test of
      the base version that is in force for the current period (effective_from not later than the current period, not
      retired), rule, fail_if, warn_rule, warn_if and max_age_quarters must not change, and the test must not be deleted
      (to change a threshold, write a new test whose effective_from is a later period). An error when --base-ref cannot
      be resolved, a warning when the repository is not a git work tree; passes vacuously without --base-ref or --period.

  - id: C-PROMPT-ISOLATION
    title: Prompt inputs stay within what the role may see
    scope: private
    level: warning
    description: >-
      00 §G6. With --counterpart, reads the front matter of the private repository's prompts/*.md (the top-level role and
      inputs, or the role and inputs, inputs_pass1 and so on of each part under parts) and compares it with the
      cannot_see of the same role in the public repository's agents/*.yml: a warning when any input of any part appears in
      that role's cannot_see (the ? of an optional input and the part-number suffix of 00 §F0, such as _04A, do not affect
      the comparison). Passes vacuously when either side is missing.

  - id: C-LANGUAGE
    title: English files contain no CJK text
    scope: both
    level: error
    description: >-
      The archives are English-first (SPEC 8.5): the Chinese version of a key document lives at zh-CN/<same path>, and no
      other text file may contain Chinese, Japanese or Korean characters (CJK ideographs, kana, hangul, CJK punctuation or
      full-width forms). Exempt are the files under zh-CN/ at the repository root; tests and fixtures (a tests/, test/ or
      fixtures/ directory, test_*.py, *_test.py, conftest.py), which may exercise Chinese text; and the title_original
      field of a sources.yml entry, which quotes a source's title in its original language. One finding per file, at
      its first line with CJK text.
