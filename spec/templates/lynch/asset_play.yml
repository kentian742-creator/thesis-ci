category: asset_play
name: Asset play
lynch: Holds valuable assets the market overlooks (cash, real estate, an investment portfolio, licenses); the key is whether the value of the assets is preserved and realized.
watch: [growth of book or asset value, signs that assets are being dissipated, returns of capital]
tests:
  - key: Q-book
    type: quantitative
    claim: Asset value per share is growing
    covers: [returns_on_capital]
    metric: book_value_per_share_yoy
    fail_if: down for 2 consecutive years
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    severity: watch
  - key: Q-cash-drag
    type: quantitative
    claim: Idle cash has not become a drag
    covers: [capital_allocation]
    metric: cash_and_tbills_to_total_assets
    fail_if: above 30% for 2 consecutive years
    rule: {op: ">", threshold: 30, unit: "%", consecutive: 2, period: year}
    data: xbrl
    severity: watch
  - key: L-dissipation
    type: qualitative
    claim: Assets are not sold off cheaply or put into investments with unclear returns
    covers: [capital_allocation, management]
    question: In this period, was there a major sale of assets below book value, or a large investment with unclear returns?
    fail_if: "yes"
    where: [notes on asset disposals and investments in this period's 10-Q/10-K, earnings press release]
    lookback: 1
    severity: watch
