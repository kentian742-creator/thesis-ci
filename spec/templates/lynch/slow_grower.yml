category: slow_grower
name: Slow grower
lynch: Large, old companies growing about as fast as GDP; they are held mainly for the dividend, and the risks are a dividend that cannot be sustained and reckless investment in search of growth.
watch: [dividend coverage, dividend growth, diversifying acquisitions]
tests:
  - key: Q-payout
    type: quantitative
    claim: The dividend is covered by free cash flow
    covers: [free_cash_flow, capital_allocation]
    metric: shareholder_return_to_fcf
    fail_if: above 110% for 2 consecutive years
    rule: {op: ">", threshold: 110, unit: "%", consecutive: 2, period: year}
    data: xbrl
    severity: watch
  - key: Q-returns
    type: quantitative
    claim: Returns on capital have not been diluted
    covers: [returns_on_capital]
    metric: roic
    fail_if: below 10% for 2 consecutive years
    rule: {op: "<", threshold: 10, unit: "%", consecutive: 2, period: year}
    data: xbrl
    severity: watch
  - key: L-diworsify
    type: qualitative
    claim: No reckless diversification in search of growth
    covers: [capital_allocation]
    question: In this period, was an acquisition announced that is unrelated to the core business and larger than 10% of market capitalization?
    fail_if: "yes"
    where: [this period's 8-K (major acquisitions), notes on acquisitions in the 10-Q/10-K]
    lookback: 1
    severity: watch
