category: cyclical
name: Cyclical
lynch: Revenue and profit rise and fall with the economic or credit cycle; the key is knowing which stage of the cycle it is in, not the numbers of a single quarter.
watch: [cycle indicators, provisions or inventories, leverage, capital allocation at the bottom of the cycle]
tests:
  - key: Q-cycle
    type: quantitative
    claim: The cycle indicator has not turned into its deteriorating stage
    covers: [balance_sheet]
    metric: provision_for_credit_losses
    fail_if: provision growth above 50% year on year for 2 consecutive quarters
    rule: {op: increase, threshold: 50, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    severity: watch
  - key: Q-leverage
    type: quantitative
    claim: Leverage has not risen ahead of the low point of the cycle
    covers: [balance_sheet]
    metric: net_debt_to_ebitda
    fail_if: above 3x
    rule: {op: ">", threshold: 3, unit: x, consecutive: 1, period: year}
    data: xbrl
    severity: watch
  - key: L-cycle-capalloc
    type: qualitative
    claim: No expensive capacity or buybacks are added at the top of the cycle
    covers: [capital_allocation]
    question: In this period, did capital expenditure or buybacks rise sharply while profit reached a record high?
    fail_if: Yes, and management did not state its assumption about the cycle
    where: ["the 10-Q/10-K of this period and the three before (capital expenditure, buybacks and the cash flow statement)", earnings calls]
    lookback: 4
    severity: watch
