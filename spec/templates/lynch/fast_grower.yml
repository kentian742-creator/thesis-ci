category: fast_grower
name: Fast grower
lynch: Small, aggressive companies growing 20–25% a year; the risks are growth stalling, expansion losing its unit economics and the balance sheet falling behind.
watch: [growth rate, whether unit economics worsen with expansion, returns on reinvestment, cash and debt]
tests:
  - key: Q-growth
    type: quantitative
    claim: Growth is still in the fast-grower range
    covers: [growth]
    metric: revenue_yoy
    fail_if: below 15% for 2 consecutive quarters
    rule: {op: "<", threshold: 15, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    severity: watch
  - key: Q-margin
    type: quantitative
    claim: Expansion has not eaten up the unit economics
    covers: [unit_economics, pricing_power]
    metric: operating_margin
    fail_if: down more than 5 percentage points year on year, for 2 consecutive quarters
    rule: {op: "decrease", threshold: 5, unit: pp, consecutive: 2, period: quarter}
    data: xbrl
    severity: watch
  - key: Q-cash
    type: quantitative
    claim: The balance sheet can carry the expansion
    covers: [balance_sheet]
    metric: net_cash
    fail_if: net cash turns into net debt
    rule: {op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
    data: xbrl
    severity: watch
  - key: L-reinvest
    type: qualitative
    claim: New directions of expansion are still within the company's capabilities
    covers: [capital_allocation]
    question: Do this period's filings disclose a major investment or acquisition in a new field unrelated to the existing business?
    fail_if: Yes, and the amount exceeds 25% of the previous fiscal year's free cash flow
    where: [notes on acquisitions and investments in this period's 10-Q/10-K, 8-K (major acquisitions), earnings press release]
    lookback: 1
    severity: watch
