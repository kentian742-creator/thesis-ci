category: turnaround
name: Turnaround
lynch: Companies that have been battered, may go bankrupt or are recovering; the key is whether liquidity lasts until the recovery is complete.
watch: [liquidity, debt maturities, progress of the margin recovery, milestones of the recovery plan]
tests:
  - key: Q-liquidity
    type: quantitative
    claim: Liquidity lasts until the recovery is complete
    covers: [balance_sheet]
    metric: net_cash
    fail_if: cash below the debt maturing in the next 12 months
    rule: {op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
    data: xbrl
    severity: breaker
  - key: Q-margin
    type: quantitative
    claim: Margins are recovering
    covers: [unit_economics]
    metric: operating_margin
    fail_if: down year on year for 2 consecutive quarters
    rule: {op: "decrease", threshold: 0, unit: pp, consecutive: 2, period: quarter}
    data: xbrl
    severity: watch
  - key: L-milestones
    type: qualitative
    claim: The milestones of the recovery plan are met on time
    covers: [management]
    question: Were the recovery milestones management promised last period met on time in this period?
    fail_if: No, and no reason was given
    where: ["the 10-Q/10-K, earnings press releases and calls of this period and the one before"]
    lookback: 2
    severity: watch
