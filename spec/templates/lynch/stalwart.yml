category: stalwart
name: Stalwart
lynch: Large, steady companies whose revenue grows about 10–12% a year; the money is made through persistence, and the risks are growth quietly slowing and expensive allocations made for growth.
watch: [whether growth is slowing, whether returns on capital hold, whether buybacks really shrink the share count, returns on large acquisitions or capital expenditure]
tests:
  - key: Q-growth
    type: quantitative
    claim: Growth has not slipped out of the stalwart range
    covers: [growth]
    metric: revenue_yoy
    fail_if: below 5% for 4 consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: below 8% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    severity: watch
  - key: Q-returns
    type: quantitative
    claim: Return on invested capital holds at the level of an excellent business
    covers: [returns_on_capital, moat]
    metric: roic
    fail_if: below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    severity: watch
  - key: Q-buyback
    type: quantitative
    claim: Buybacks really shrink the share count instead of offsetting stock-based compensation
    covers: [capital_allocation]
    metric: diluted_shares_yoy
    fail_if: above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    severity: watch
  - key: Q-fcf
    type: quantitative
    claim: Profit turns into cash
    covers: [free_cash_flow]
    metric: fcf_conversion
    fail_if: below 70% for 2 consecutive years
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    severity: watch
  - key: L-guidance
    type: qualitative
    claim: Management has not lowered the medium-term financial targets it published
    covers: [management]
    question: In this period's documents, did management lower or withdraw the medium-term financial targets it had published?
    fail_if: Yes, without giving new, testable targets at the same time
    where: ["earnings press releases, calls and investor day materials of this period and the three before (four periods in all)"]
    lookback: 4
    severity: watch
