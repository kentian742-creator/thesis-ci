[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thesis-ci"
version = "0.2.1"
description = "Thesis as code: lint investment-thesis archives (thesis.yml, sources, pre-registrations) and score forecast calibration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-SPEC.md"]
authors = [{ name = "kentian742-creator" }]
keywords = ["investing", "thesis", "linter", "calibration", "brier", "ci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
thesis-ci = "thesis_ci.cli:main"

[project.urls]
Homepage = "https://github.com/kentian742-creator/thesis-ci"

# The format contract lives in the top-level spec/ directory (licensed CC BY 4.0).
# Wheels ship it inside the package as thesis_ci/spec; editable installs read spec/ directly.
[tool.hatch.build.targets.wheel]
packages = ["src/thesis_ci"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "thesis_ci/spec"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/spec",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/LICENSE-SPEC.md",
    "/CHANGELOG.md",
    "/action.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
