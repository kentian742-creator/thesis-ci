# Publish thesis-ci to PyPI when a GitHub release is published (or by hand for an existing tag).
# Authentication is PyPI trusted publishing (OIDC): no API token is stored anywhere. PyPI must list this repository,
# this workflow file and the environment "pypi" as a trusted publisher of the project "thesis-ci".
name: publish

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Test before publishing
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
          thesis-ci selftest
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
