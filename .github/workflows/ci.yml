name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: pytest
        run: pytest -q
      - name: selftest
        run: thesis-ci selftest

  action:
    name: action on the bundled example archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the public example
        uses: ./
        with:
          path: src/thesis_ci/fixtures/workspace/public
          counterpart: src/thesis_ci/fixtures/workspace/private
          expect-visibility: public
      - name: Lint the private example
        uses: ./
        with:
          path: src/thesis_ci/fixtures/workspace/private
          counterpart: src/thesis_ci/fixtures/workspace/public
          expect-visibility: private
