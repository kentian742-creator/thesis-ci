schema_version: "0.2"
company: ACME
name: ACME Corp. (fictitious)
exchange: NYSE
status: holding
filer:
  cik: "0000000001"
  type: domestic
  fiscal_year_end: "06-30"
  earnings_form: 8-K
  annual_form: 10-K
category: stalwart
category_rationale: Revenue has grown steadily by about 11% a year for many years [src:ACME-RPT-2026-09#p3], which makes it a stalwart.
domain: other
depends_on: [industries/widgets]
trust_level: 1
as_of: 2026-09-22
reviewed:
  business: 2026-09-20
  economics: 2026-09-20
  moat: 2026-09-20
  capital_allocation: 2026-09-20
  management: 2026-09-20
  culture: 2026-09-20
  runway: 2026-09-20
  valuation: 2026-09-20
  bear_case: 2026-09-22
  monitoring: 2026-09-20
  thesis: 2026-09-20
  breakers: 2026-09-20
  munger: 2026-09-20
ratings:
  business: A-
  management: B+
  capital_allocation: B
  source: ACME-RPT-2026-09#p2
thesis:
  summary: The leading maker of small parts that factories cannot do without; recurring revenue is 60% of revenue [src:ACME-RPT-2026-09#p4].
  pillars:
    - id: P1
      claim: A customer that changes suppliers must recertify whole production lines, so switching costs are high
      source: ACME-RPT-2026-09#p5
    - id: P2
      claim: Free cash flow grows with revenue
  permanent_loss_paths:
    - A new open standard makes compatibility worthless
baseline_facts:
  - id: F1
    label: Gross margin
    value: 62
    unit: "%"
    period: FY2026
    as_of: 2026-06-30
    source: ACME-10K-FY2026#Item8
tests:
  - id: ACME-Q1
    type: quantitative
    claim: Buybacks really shrink the share count
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    metric: diluted_shares_yoy
    fail_if: above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
  - id: ACME-Q2
    type: quantitative
    claim: Gross margin shows that pricing power holds
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat]
    metric: gross_margin
    fail_if: below 55% for two consecutive quarters
    rule: {op: "<", threshold: 55, unit: "%", consecutive: 2, period: quarter}
    warn_if: below 58%
    warn_rule: {op: "<", threshold: 58, unit: "%", consecutive: 1, period: quarter}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline: {value: 62, unit: "%", period: FY2026, source: ACME-10K-FY2026#Item8}
  - id: ACME-Q3
    type: quantitative
    claim: Profit turns into cash and returns on capital hold
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow, returns_on_capital]
    metric: fcf_conversion
    fail_if: below 70% for 2 consecutive years
    rule:
      all_of:
        - {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
  - id: ACME-Q4
    type: quantitative
    claim: Recurring revenue holds its share of revenue (old revenue disaggregation basis)
    origin: report:watch
    severity: watch
    covers: [moat]
    metric_def: {id: recurring_share, description: recurring revenue ÷ total revenue (old basis), unit: "%", data: filing_text, where: revenue disaggregation note of the 10-K}
    fail_if: below 50% for two consecutive years
    rule: {op: "<", threshold: 50, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2027Q1
    retired_at: FY2027Q2
    note: From FY2027Q2 the company discloses its revenue on a new disaggregation basis; this test is kept as a record only and is replaced by ACME-Q5.
  - id: ACME-Q5
    type: quantitative
    claim: Recurring revenue holds its share of revenue, and recurring revenue itself has not shrunk
    origin: proposal:04B
    severity: watch
    covers: [moat]
    supersedes: ACME-Q4
    metric_def:
      id: recurring_share_v2
      description: recurring revenue ÷ total revenue (new basis)
      unit: "%"
      data: mixed
      formula: recurring / revenue
      components:
        recurring: {description: recurring revenue (services and subscriptions), unit: USD, where: revenue disaggregation note of the 10-K}
        revenue: {description: total revenue, unit: USD, xbrl: ["us-gaap:Revenues"]}
    fail_if: below 50% for two consecutive years, and recurring revenue down year on year
    rule:
      all_of:
        - {metric: recurring_share_v2, op: "<", threshold: 50, unit: "%", consecutive: 2, period: year}
        - {metric: recurring_share_v2.recurring, op: decrease, threshold: 0, unit: "%", consecutive: 1, period: year}
      evaluate_from: FY2027Q2
    data: mixed
    effective_from: FY2027Q2
  - id: ACME-L1
    type: qualitative
    claim: Management has not lowered the medium-term financial targets it published
    origin: template:stalwart
    severity: watch
    covers: [management]
    question: In this period's documents, did management lower or withdraw the medium-term financial targets it had published?
    fail_if: Yes, without giving new, testable targets at the same time
    judge: independent_model
    evidence: required
    where: [earnings press releases and calls of this period and the three before, investor day materials]
    lookback: 4
    judge_notes: Compare only the medium-term targets the company itself published; analysts' expectations are not targets.
    effective_from: FY2027Q1
  - id: ACME-S1
    type: staleness
    claim: The moat judgment goes no longer than four quarters without a review
    origin: template:stalwart
    severity: watch
    covers: [moat]
    section: moat
    max_age_quarters: 4
    effective_from: FY2027Q1
  - id: ACME-S2
    type: staleness
    claim: The bear case (where this is most likely wrong) is re-examined every two quarters
    origin: template:stalwart
    severity: watch
    covers: [other]
    section: bear_case
    max_age_quarters: 2
    effective_from: FY2027Q1
todo:
