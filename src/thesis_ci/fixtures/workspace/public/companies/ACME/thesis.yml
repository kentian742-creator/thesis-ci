schema_version: "0.2"
company: ACME
name: ACME Corp. (fictitious)
exchange: NYSE
status: holding
filer:
  cik: "0000000001"
  type: domestic
  fiscal_year_end: "06-30"
  earnings_form: 8-K
  annual_form: 10-K
category: stalwart
category_rationale: 收入多年稳定增长约 11%[src:ACME-RPT-2026-09#p3]，属于稳定增长型。
domain: other
depends_on: [industries/widgets]
trust_level: 1
as_of: 2026-09-22
reviewed:
  business: 2026-09-20
  economics: 2026-09-20
  moat: 2026-09-20
  capital_allocation: 2026-09-20
  management: 2026-09-20
  culture: 2026-09-20
  runway: 2026-09-20
  valuation: 2026-09-20
  bear_case: 2026-09-22
  monitoring: 2026-09-20
  thesis: 2026-09-20
  breakers: 2026-09-20
  munger: 2026-09-20
ratings:
  business: A-
  management: B+
  capital_allocation: B
  source: ACME-RPT-2026-09#p2
thesis:
  summary: 工厂离不开的小部件龙头，经常性收入占比 60%[src:ACME-RPT-2026-09#p4]。
  pillars:
    - id: P1
      claim: 客户换供应商要重新认证整条产线，转换成本高
      source: ACME-RPT-2026-09#p5
    - id: P2
      claim: 自由现金流随收入增长
  permanent_loss_paths:
    - 新的开放标准让兼容性不再值钱
baseline_facts:
  - id: F1
    label: 毛利率
    value: 62
    unit: "%"
    period: FY2026
    as_of: 2026-06-30
    source: ACME-10K-FY2026#Item8
tests:
  - id: ACME-Q1
    type: quantitative
    claim: 回购在真正缩减股本
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    metric: diluted_shares_yoy
    fail_if: 连续 2 年大于 0
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
  - id: ACME-Q2
    type: quantitative
    claim: 毛利率守住定价权
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat]
    metric: gross_margin
    fail_if: 连续两个季度低于 55%
    rule: {op: "<", threshold: 55, unit: "%", consecutive: 2, period: quarter}
    warn_if: 低于 58%
    warn_rule: {op: "<", threshold: 58, unit: "%", consecutive: 1, period: quarter}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline: {value: 62, unit: "%", period: FY2026, source: ACME-10K-FY2026#Item8}
  - id: ACME-Q3
    type: quantitative
    claim: 利润能变成现金，资本回报守住
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow, returns_on_capital]
    metric: fcf_conversion
    fail_if: 连续 2 年低于 70%
    rule:
      all_of:
        - {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
  - id: ACME-Q4
    type: quantitative
    claim: 经常性收入占比守住（旧收入分解口径）
    origin: report:watch
    severity: watch
    covers: [moat]
    metric_def: {id: recurring_share, description: 经常性收入 ÷ 总收入（旧口径）, unit: "%", data: filing_text, where: 10-K 收入分解附注}
    fail_if: 连续两年低于 50%
    rule: {op: "<", threshold: 50, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2027Q1
    retired_at: FY2027Q2
    note: 公司自 FY2027Q2 起改用新的收入分解口径，本条只作记录，由 ACME-Q5 接替。
  - id: ACME-Q5
    type: quantitative
    claim: 经常性收入占比守住，且经常性收入本身没有萎缩
    origin: proposal:04B
    severity: watch
    covers: [moat]
    supersedes: ACME-Q4
    metric_def:
      id: recurring_share_v2
      description: 经常性收入 ÷ 总收入（新口径）
      unit: "%"
      data: mixed
      formula: recurring / revenue
      components:
        recurring: {description: 经常性收入（服务与订阅）, unit: USD, where: 10-K 收入分解附注}
        revenue: {description: 总收入, unit: USD, xbrl: ["us-gaap:Revenues"]}
    fail_if: 连续两年低于 50%，且经常性收入同比下降
    rule:
      all_of:
        - {metric: recurring_share_v2, op: "<", threshold: 50, unit: "%", consecutive: 2, period: year}
        - {metric: recurring_share_v2.recurring, op: decrease, threshold: 0, unit: "%", consecutive: 1, period: year}
      evaluate_from: FY2027Q2
    data: mixed
    effective_from: FY2027Q2
  - id: ACME-L1
    type: qualitative
    claim: 管理层没有下调已公布的中期财务目标
    origin: template:stalwart
    severity: watch
    covers: [management]
    question: 本期文件中，管理层是否下调或撤回了此前公布的中期财务目标？
    fail_if: 是，且没有同时给出可检验的新目标
    judge: independent_model
    evidence: required
    where: [本期与此前三期的业绩新闻稿与电话会, 投资者日材料]
    lookback: 4
    judge_notes: 只比较公司自己公布的中期目标；分析师预期不算目标。
    effective_from: FY2027Q1
  - id: ACME-S1
    type: staleness
    claim: 护城河判断不超过四个季度未复核
    origin: template:stalwart
    severity: watch
    covers: [moat]
    section: moat
    max_age_quarters: 4
    effective_from: FY2027Q1
  - id: ACME-S2
    type: staleness
    claim: 反方论证（最可能错在哪）每两个季度重新审视
    origin: template:stalwart
    severity: watch
    covers: [other]
    section: bear_case
    max_age_quarters: 2
    effective_from: FY2027Q1
