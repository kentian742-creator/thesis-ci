    type: quantitative
    rule:
      all_of:
      - metric: cash_drag.above_private_line
        op: event
        threshold: Year-end cash and Treasury bills above the breaker line registered in the private valuation file
        consecutive: 2
        period: year
      - metric: cash_drag.capital_deployed_to_operating_cash_flow_2y
        op: <
        threshold: 50
        unit: '%'
        consecutive: 1
        period: year
    data: mixed
    effective_from: FY2026Q3
    metric_def:
      id: cash_drag
      unit: '%'
      frequency: year
      data: mixed
      formula: above_private_line = (cash_and_equivalents + us_treasury_bills)_year_end > private_line_year_end; capital_deployed_to_operating_cash_flow_2y
        = sum_2y(acquisitions_net_of_cash_acquired + equity_purchases - equity_sales) / sum_2y(operating_cash_flow)
      components:
        above_private_line:
          unit: event
        capital_deployed_to_operating_cash_flow_2y:
          unit: '%'
      description: (omitted)
  - id: BRK-Q8
    type: quantitative
    rule:
      any_of:
      - metric: buyback_avg_price_to_book
        op: '>'
        threshold: 1.8
        unit: x
        consecutive: 1
        period: quarter
      - all_of:
        - metric: buyback_avg_price_to_book.below_private_line
          op: event
          threshold: Quarter-end price below the breaker line registered in the private valuation file
        - metric: buyback_amount
          op: ==
          threshold: 0
          unit: USD
        consecutive: 4
        period: quarter
    data: mixed
    effective_from: FY2026Q3
    metric_def:
      id: buyback_avg_price_to_book
      unit: x
      frequency: quarter
      data: mixed
      formula: max_month(avg_repurchase_price_per_A_equivalent_share) / book_value_per_A_share_prior_quarter_end
      components:
        below_private_line:
          unit: event
      description: (omitted)
