# Snapshot of the quantitative tests of the owners-office archives (companies/*/thesis.yml), reduced to
# the fields the evaluation engine reads. Regenerate: python tests/test_archive_rules.py <owners-office>
APP:
  company: APP
  filer:
    cik: 0001751008
    type: domestic
    fiscal_year_end: 12-31
    earnings_form: 8-K
    annual_form: 10-K
  tests:
  - id: APP-Q1
    type: quantitative
    metric: revenue_yoy
    rule:
      op: <
      threshold: 15
      unit: '%'
      consecutive: 2
      period: quarter
    data: xbrl
    effective_from: FY2026Q3
  - id: APP-Q2
    type: quantitative
    metric: operating_margin
    rule:
      op: decrease
      threshold: 5
      unit: pp
      consecutive: 2
      period: quarter
    data: xbrl
    effective_from: FY2026Q3
  - id: APP-Q3
    type: quantitative
    rule:
      op: '>'
      threshold: 1
      unit: x
      consecutive: 1
      period: quarter
    data: xbrl
    effective_from: FY2026Q3
    metric_def:
      id: net_debt_to_fcf_ttm
      unit: x
      frequency: quarter
      data: xbrl
      xbrl:
      - us-gaap:LongTermDebt
      - us-gaap:LongTermDebtNoncurrent
      - us-gaap:CashAndCashEquivalentsAtCarryingValue
      - us-gaap:ShortTermInvestments
      - us-gaap:NetCashProvidedByUsedInOperatingActivities
      - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
      formula: (debt - cash - short_term_investments) / sum_4q(operating_cash_flow - capex)
      description: (omitted)
  - id: APP-Q4
    type: quantitative
    metric: roic
    rule:
      op: <
      threshold: 12
      unit: '%'
      consecutive: 2
      period: year
    data: xbrl
    effective_from: FY2026Q3
  - id: APP-Q5
    type: quantitative
    rule:
      all_of:
      - metric: revenue_yoy
        op: <
        threshold: 15
        unit: '%'
        consecutive: 2
        period: quarter
      - metric: axon_unit_drivers_yoy.installs
        op: <
        threshold: 0
        unit: '%'
        consecutive: 2
        period: quarter
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: axon_unit_drivers_yoy
      unit: '%'
      frequency: quarter
      data: filing_text
      components:
        installs:
          unit: '%'
        net_revenue_per_install:
          unit: '%'
      description: (omitted)
  - id: APP-Q6
    type: quantitative
    rule:
      op: <
      threshold: 45
      unit: '%'
      consecutive: 2
      period: quarter
    data: xbrl
    effective_from: FY2026Q3
    metric_def:
      id: owner_fcf_margin_ttm
      unit: '%'
      frequency: quarter
      data: xbrl
      xbrl:
      - us-gaap:NetCashProvidedByUsedInOperatingActivities
      - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
      - us-gaap:ShareBasedCompensation
      - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
      - us-gaap:Revenues
      formula: sum_4q(operating_cash_flow - capex - stock_based_compensation) / sum_4q(revenue)
      description: (omitted)
  - id: APP-Q7
    type: quantitative
    rule:
      all_of:
      - metric: axon_unit_drivers_yoy.installs
        op: <
        threshold: -15
        unit: '%'
        consecutive: 3
        period: quarter
      - metric: axon_unit_drivers_yoy.net_revenue_per_install
        op: <
        threshold: 10
        unit: '%'
        consecutive: 3
        period: quarter
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: axon_unit_drivers_yoy
      unit: '%'
      frequency: quarter
      data: filing_text
      components:
        installs:
          unit: '%'
        net_revenue_per_install:
          unit: '%'
      description: (omitted)
  - id: APP-Q8
    type: quantitative
    rule:
      any_of:
      - metric: acquisition_event.consideration
        op: '>'
        threshold: 100
        unit: USD 100 million
        period: event
      - metric: acquisition_event.new_shares_pct
        op: '>'
        threshold: 5
        unit: '%'
        period: event
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: acquisition_event
      unit: USD 100 million / % (by component)
      frequency: event
      data: filing_text
      components:
        consideration:
          unit: USD 100 million
        new_shares_pct:
          unit: '%'
      description: (omitted)
  - id: APP-Q9
    type: quantitative
    rule:
      any_of:
      - metric: guidance_delivery.vs_mid
        op: <
        threshold: 0
        unit: '%'
        consecutive: 2
        period: quarter
      - metric: revenue_yoy
        op: <
        threshold: 20
        unit: '%'
        consecutive: 1
        period: quarter
    warn_rule:
      any_of:
      - metric: guidance_delivery.vs_mid
        op: <
        threshold: 0
        unit: '%'
        consecutive: 1
        period: quarter
      - metric: guidance_delivery.q4_qoq_accel
        op: <=
        threshold: 0
        unit: pp
        consecutive: 1
        period: year
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: guidance_delivery
      unit: '% / pp (by component)'
      frequency: quarter
      data: filing_text
      components:
        vs_mid:
          unit: '%'
        q4_qoq_accel:
          unit: pp
      description: (omitted)
  - id: APP-Q10
    type: quantitative
    rule:
      all_of:
      - metric: axon_unit_drivers_yoy.installs
        op: <
        threshold: -10
        unit: '%'
        consecutive: 2
        period: quarter
      - metric: axon_unit_drivers_yoy.net_revenue_per_install
        op: <
        threshold: 20
        unit: '%'
        consecutive: 2
        period: quarter
    warn_rule:
      all_of:
      - metric: axon_unit_drivers_yoy.net_revenue_per_install
        op: <
        threshold: 30
        unit: '%'
        consecutive: 1
        period: quarter
      - metric: axon_unit_drivers_yoy.installs
        op: <=
        threshold: 0
        unit: '%'
        consecutive: 1
        period: quarter
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: axon_unit_drivers_yoy
      unit: '%'
      frequency: quarter
      data: filing_text
      components:
        installs:
          unit: '%'
        net_revenue_per_install:
          unit: '%'
      description: (omitted)
  - id: APP-Q11
    type: quantitative
    rule:
      op: <
      threshold: 55
      unit: '%'
      consecutive: 1
      period: quarter
    warn_rule:
      op: <
      threshold: 58
      unit: '%'
      consecutive: 1
      period: year
      evaluate_on:
      - FY2026
    data: xbrl
    effective_from: FY2026Q3
    metric_def:
      id: owner_fcf_margin_ttm
      unit: '%'
      frequency: quarter
      data: xbrl
      xbrl:
      - us-gaap:NetCashProvidedByUsedInOperatingActivities
      - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
      - us-gaap:ShareBasedCompensation
      - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
      - us-gaap:Revenues
      formula: sum_4q(operating_cash_flow - capex - stock_based_compensation) / sum_4q(revenue)
      description: (omitted)
  - id: APP-Q12
    type: quantitative
    rule:
      all_of:
      - metric: vector_speed_gap.vector_qoq
        op: '>='
        threshold: 10
        unit: '%'
        consecutive: 2
        period: quarter
      - metric: vector_speed_gap.app_vs_mid
        op: <
        threshold: 0
        unit: '%'
        consecutive: 2
        period: quarter
    warn_rule:
      any_of:
      - metric: vector_speed_gap.gap_change
        op: '>='
        threshold: 0
        unit: pp
        consecutive: 1
        period: quarter
      - metric: vector_speed_gap.app_vs_mid
        op: <
        threshold: 0
        unit: '%'
        consecutive: 1
        period: quarter
    data: mixed
    effective_from: FY2026Q3
    metric_def:
      id: vector_speed_gap
      unit: '% / pp (by component)'
      frequency: quarter
      data: mixed
      components:
        vector_qoq:
          unit: '%'
        app_vs_mid:
          unit: '%'
        gap_change:
          unit: pp
      description: (omitted)
  - id: APP-Q13
    type: quantitative
    rule:
      any_of:
      - metric: upgrade_check.vs_mid
        op: <
        threshold: 0
        unit: '%'
        consecutive: 1
        period: quarter
      - metric: upgrade_check.q4_qoq_accel
        op: <=
        threshold: 0
        unit: pp
        consecutive: 1
        period: year
      - all_of:
        - metric: upgrade_check.installs
          op: <
          threshold: 0
          unit: '%'
          consecutive: 1
          period: quarter
        - metric: upgrade_check.net_revenue_per_install
          op: <
          threshold: 30
          unit: '%'
          consecutive: 1
          period: quarter
        evaluate_on:
        - FY2026Q3
      evaluate_on:
      - FY2026Q3
      - FY2026Q4
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: upgrade_check
      unit: '% / pp (by component)'
      frequency: quarter
      data: filing_text
      components:
        vs_mid:
          unit: '%'
        q4_qoq_accel:
          unit: pp
        installs:
          unit: '%'
        net_revenue_per_install:
          unit: '%'
      description: (omitted)
AXP:
  company: AXP
  filer:
    cik: 0000004962
    type: domestic
    fiscal_year_end: 12-31
    earnings_form: 8-K
    annual_form: 10-K
  tests:
  - id: AXP-Q1
    type: quantitative
    rule:
      op: <
      threshold: 5
      unit: '%'
      consecutive: 4
      period: quarter
    warn_rule:
      op: <
      threshold: 8
      unit: '%'
      consecutive: 2
      period: quarter
    data: xbrl
    effective_from: FY2026Q3
    metric_def:
      id: revenue_net_of_interest_expense_yoy
      unit: '%'
      frequency: quarter
      data: xbrl
      xbrl:
      - us-gaap:RevenuesNetOfInterestExpense
      - us-gaap:Revenues
      formula: revenue_t / revenue_{t-4q} - 1
      description: (omitted)
  - id: AXP-Q2
    type: quantitative
    metric: roe
    rule:
      op: <
      threshold: 12
      unit: '%'
      consecutive: 2
      period: year
    data: xbrl
    effective_from: FY2026Q3
  - id: AXP-Q3
    type: quantitative
    metric: diluted_shares_yoy
    rule:
      op: '>'
      threshold: 0
      unit: '%'
      consecutive: 2
      period: year
    data: xbrl
    effective_from: FY2026Q3
  - id: AXP-Q4
    type: quantitative
    rule:
      op: <
      threshold: 70
      unit: '%'
      consecutive: 2
      period: year
    data: xbrl
    effective_from: FY2026Q3
    metric_def:
      id: capital_return_to_common_ni_3y
      unit: '%'
      frequency: year
      data: xbrl
      xbrl:
      - us-gaap:PaymentsForRepurchaseOfCommonStock
      - us-gaap:PaymentsOfDividendsCommonStock
      - us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic
      formula: sum_3y(buybacks + common_dividends) / sum_3y(net_income_to_common)
      description: (omitted)
  - id: AXP-Q5
    type: quantitative
    rule:
      op: '>'
      threshold: 0
      unit: pp
      consecutive: 2
      period: year
      evaluate_from: FY2026
    warn_rule:
      op: '>'
      threshold: 0
      unit: pp
      consecutive: 1
      period: year
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: delta_remuneration_growth_minus_revenue_growth
      unit: pp
      frequency: year
      data: filing_text
      formula: yoy(delta_amex_remuneration) - yoy(axp_revenue_net_of_interest_expense)
      description: (omitted)
  - id: AXP-Q6
    type: quantitative
    metric: net_card_fees_yoy
    rule:
      all_of:
      - metric: net_card_fees_yoy
        op: <
        threshold: 10
        unit: '%'
        consecutive: 1
        period: quarter
      - metric: net_card_fees_yoy.card_member_services_expense_yoy
        op: '>='
        threshold: 30
        unit: '%'
        consecutive: 1
        period: quarter
      evaluate_on:
      - FY2027Q2
    warn_rule:
      any_of:
      - metric: net_card_fees_yoy
        op: <
        threshold: 10
        unit: '%'
        consecutive: 1
        period: quarter
      - metric: net_card_fees_yoy.card_member_services_expense_yoy
        op: '>='
        threshold: 15
        unit: '%'
        consecutive: 1
        period: quarter
      evaluate_on:
      - FY2027Q2
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      unit: '%'
      frequency: quarter
      data: filing_text
      components:
        card_member_services_expense_yoy:
          unit: '%'
      description: (omitted)
  - id: AXP-Q7
    type: quantitative
    metric: reserve_build_release
    rule:
      all_of:
      - metric: reserve_build_release.industry_card_nco_rate
        op: '>='
        threshold: 4.73
        unit: '%'
        consecutive: 1
        period: quarter
      - metric: reserve_build_release
        op: '>'
        threshold: 0
        unit: USD
        consecutive: 2
        period: quarter
    data: mixed
    effective_from: FY2026Q3
    metric_def:
      unit: USD
      frequency: quarter
      data: mixed
      components:
        industry_card_nco_rate:
          unit: '%'
      description: (omitted)
  - id: AXP-Q8
    type: quantitative
    metric: discount_revenue_to_billed_business
    rule:
      all_of:
      - any_of:
        - metric: discount_revenue_to_billed_business
          op: decrease
          threshold: 0.05
          unit: pp
          consecutive: 2
          period: year
        - metric: discount_revenue_to_billed_business
          op: <
          threshold: 2.15
          unit: '%'
          consecutive: 1
          period: year
      - metric: discount_revenue_to_billed_business.merchant_rate_unexplained_decline_bp
        op: '>'
        threshold: 0
        unit: bp
        period: year
    data: filing_text
    effective_from: FY2026Q3
    retired_at: FY2026Q4
    metric_def:
      unit: '%'
      frequency: year
      data: filing_text
      components:
        cobrand_share_of_billed_business:
          unit: '%'
        merchant_rate_unexplained_decline_bp:
          unit: bp
      description: (omitted)
  - id: AXP-Q17
    type: quantitative
    metric: discount_revenue_to_billed_business
    rule:
      all_of:
      - any_of:
        - metric: discount_revenue_to_billed_business
          op: decrease
          threshold: 0.05
          unit: pp
          consecutive: 2
          period: year
        - metric: discount_revenue_to_billed_business
          op: <
          threshold: 2.15
          unit: '%'
          consecutive: 1
          period: year
      - metric: discount_revenue_to_billed_business.merchant_rate_unexplained_decline_bp
        op: '>'
        threshold: 0
        unit: bp
        period: year
    data: filing_text
    effective_from: FY2026Q4
    supersedes: AXP-Q8
    metric_def:
      unit: '%'
      frequency: year
      data: filing_text
      components:
        cobrand_share_of_billed_business:
          unit: '%'
        merchant_rate_unexplained_decline_bp:
          unit: bp
      description: (omitted)
  - id: AXP-Q9
    type: quantitative
    rule:
      metric: net_card_fee_to_cm_services_increment.qoq_change
      op: <
      threshold: 0
      unit: x
      consecutive: 2
      period: quarter
    warn_rule:
      op: <
      threshold: 1.0
      unit: x
      consecutive: 1
      period: quarter
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: net_card_fee_to_cm_services_increment
      unit: x
      frequency: quarter
      data: filing_text
      formula: (net_card_fees_t - net_card_fees_{t-4q}) / (cm_services_t - cm_services_{t-4q})
      components:
        qoq_change:
          unit: x
      description: (omitted)
  - id: AXP-Q10
    type: quantitative
    metric: interest_expense_minus_income_growth
    rule:
      op: '>'
      threshold: 0
      unit: pp
      consecutive: 2
      period: quarter
    data: xbrl
    effective_from: FY2026Q3
  - id: AXP-Q11
    type: quantitative
    rule:
      metric: nco_spread_industry_minus_axp.nco_spread_yoy_change
      op: <
      threshold: 0
      unit: pp
      consecutive: 2
      period: quarter
    data: mixed
    effective_from: FY2026Q3
    metric_def:
      id: nco_spread_industry_minus_axp
      unit: pp
      frequency: quarter
      data: mixed
      formula: industry_card_nco_rate - net_write_off_rate
      components:
        industry_card_nco_rate:
          unit: '%'
        nco_spread_yoy_change:
          unit: pp
      description: (omitted)
  - id: AXP-Q12
    type: quantitative
    metric: reserve_build_release
    rule:
      all_of:
      - metric: reserve_build_release
        op: '>'
        threshold: 0
        unit: USD
      - metric: reserve_build_release.reserve_rate_yoy_change
        op: '>'
        threshold: 0
        unit: pp
      consecutive: 1
      period: quarter
    warn_rule:
      op: '>'
      threshold: 0
      unit: USD
      consecutive: 1
      period: quarter
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      unit: USD
      frequency: quarter
      data: filing_text
      components:
        reserve_rate_yoy_change:
          unit: pp
      description: (omitted)
  - id: AXP-Q13
    type: quantitative
    rule:
      all_of:
      - metric: proprietary_new_cards_yoy
        op: <
        threshold: 0
        unit: '%'
      - metric: proprietary_new_cards_yoy.marketing_expense_yoy
        op: '>'
        threshold: 0
        unit: '%'
      consecutive: 3
      period: quarter
    warn_rule:
      all_of:
      - metric: proprietary_new_cards_yoy
        op: <
        threshold: 0
        unit: '%'
      - metric: proprietary_new_cards_yoy.marketing_expense_yoy
        op: '>'
        threshold: 0
        unit: '%'
      consecutive: 2
      period: quarter
    data: filing_text
    effective_from: FY2026Q3
    metric_def:
      id: proprietary_new_cards_yoy
      unit: '%'
      frequency: quarter
      data: filing_text
      formula: new_cards_t / new_cards_{t-4q} - 1
      components:
        marketing_expense_yoy:
          unit: '%'
      description: (omitted)
  - id: AXP-Q14
    type: quantitative
    rule:
      op: <
      threshold: 8.5
      unit: '%'
      consecutive: 1
      period: half
      evaluate_on:
      - FY2027Q2
    data: xbrl
    effective_from: FY2026Q3
    metric_def:
      id: pre_provision_pretax_income_yoy
      unit: '%'
      frequency: quarter
      data: xbrl
      xbrl:
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
      - us-gaap:ProvisionForLoanLeaseAndOtherLosses
      - us-gaap:ProvisionForLoanAndLeaseLosses
      formula: (pretax_income + provisions)_t / (pretax_income + provisions)_{t-4q} - 1
      description: (omitted)
  - id: AXP-Q15
    type: quantitative
    rule:
      op: <
      threshold: 0
      unit: '%'
      consecutive: 2
      period: year
    data: xbrl
    effective_from: FY2026Q3
    metric_def:
      id: diluted_eps_yoy
      unit: '%'
      frequency: year
      data: xbrl
      xbrl:
      - us-gaap:EarningsPerShareDiluted
      formula: eps_diluted_t / eps_diluted_{t-1y} - 1
      description: (omitted)
  - id: AXP-Q16
    type: quantitative
    metric: segment_operating_margin
    params:
      segment: International Card Services
      basis: Segment pretax income ÷ segment total revenues net of interest expense (the company's segment basis)
    rule:
      op: decrease
      threshold: 0
      unit: pp
      consecutive: 2
      period: year
    data: filing_text
    effective_from: FY2026Q3
